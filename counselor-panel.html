<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>پنل مشاور | رزرو نوبت</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --red: #b31b1b;
      --gold: #d4af37;
      --blue: #1a237e;
      --primary: #4CAF50;
      --secondary: #2196F3;
      --accent: #FF9800;
      --purple: #9C27B0;
      --live-red: #ff3a4e;
      --glass-light: rgba(255, 255, 255, 0.22);
      --glass-dark: rgba(255, 255, 255, 0.15);
      --border: rgba(255, 255, 255, 0.28);
      --border-strong: rgba(255, 255, 255, 0.42);
      --shadow: 0 12px 40px rgba(0, 0, 0, 0.55);
      --shadow-hover: 0 18px 50px rgba(0, 0, 0, 0.75);
      --transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, #0a0a1a, #0f1428, #0a0f1f, #0a0a1a);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 2rem 1rem;
      line-height: 1.6;
      background-attachment: fixed;
      background-size: 400% 400%;
      animation: gradientBG 20s ease infinite;
      position: relative;
      overflow-x: hidden;
    }

    @keyframes gradientBG {      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* ========== GLASS SHADER EFFECT ========== */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: 
        radial-gradient(circle at 10% 20%, rgba(255, 60, 78, 0.08) 0%, transparent 25%),
        radial-gradient(circle at 90% 30%, rgba(33, 150, 243, 0.07) 0%, transparent 25%),
        radial-gradient(circle at 30% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 25%),
        radial-gradient(circle at 70% 70%, rgba(156, 39, 176, 0.07) 0%, transparent 25%);
      z-index: -3;
      opacity: 0.85;
    }

    /* ========== FLOATING ORBS ========== */
    .floating-orb {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      z-index: -1;
      animation: floatOrb 25s infinite linear;
      opacity: 0.6;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.3);
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.6; }
      25% { transform: translateY(-60px) translateX(40px) rotate(90deg); opacity: 0.3; }
      50% { transform: translateY(-120px) translateX(0) rotate(180deg); opacity: 0.1; }
      75% { transform: translateY(-60px) translateX(-40px) rotate(270deg); opacity: 0.3; }
      100% { transform: translateY(0) translateX(0) rotate(360deg); opacity: 0.6; }
    }

    /* ========== SCROLL PROGRESS ========== */
    .scroll-progress {
      position: fixed;
      top: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, var(--live-red), var(--accent), var(--purple), var(--secondary), var(--primary), var(--gold));
      z-index: 10000;
      width: 0%;      box-shadow: 0 0 15px rgba(255, 60, 78, 0.9), 0 0 25px rgba(255, 152, 0, 0.8);
      transition: width 0.12s ease;
    }

    /* ========== BACK LINK ========== */
    .back-link {
      position: absolute;
      top: 1.8rem;
      left: 1.8rem;
      color: var(--gold);
      text-decoration: none;
      font-weight: 700;
      font-size: 1.15rem;
      padding: 0.6rem 1.4rem;
      border-radius: 30px;
      background: var(--glass-dark);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      transition: var(--transition);
      transform: translateX(-50px);
      opacity: 0;
    }

    .back-link.visible {
      transform: translateX(0);
      opacity: 1;
    }

    .back-link:hover {
      transform: translateX(5px);
      background: rgba(212, 175, 55, 0.25);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .back-link i {
      margin-left: 8px;
    }

    /* ========== PANEL ========== */
    .panel {
      background: var(--glass-dark);
      backdrop-filter: blur(35px);
      -webkit-backdrop-filter: blur(35px);
      border: 2px solid var(--border-strong);
      border-radius: 35px;
      padding: 3rem;
      max-width: 550px;
      width: 100%;
      box-shadow: var(--shadow);      position: relative;
      overflow: hidden;
      transform: translateY(40px);
      opacity: 0;
      transition: var(--transition);
    }

    .panel.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .panel::before {
      content: "";
      position: absolute;
      top: -3px;
      right: -3px;
      bottom: -3px;
      left: -3px;
      background: linear-gradient(45deg, var(--gold), var(--secondary), var(--primary), var(--purple), var(--accent), var(--gold));
      z-index: -1;
      border-radius: 38px;
      animation: rotateGradient 12s linear infinite;
      opacity: 0.85;
    }

    .panel::after {
      content: "";
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      background: linear-gradient(135deg, rgba(15, 20, 40, 0.9), rgba(25, 30, 55, 0.85));
      border-radius: 35px;
      z-index: -1;
    }

    .panel:hover {
      transform: translateY(-8px) scale(1.01);
      box-shadow: var(--shadow-hover);
      border-color: var(--border-strong);
    }

    @keyframes rotateGradient {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ========== HEADER ========== */    h2 {
      text-align: center;
      margin-bottom: 2.5rem;
      color: white;
      font-size: 2.8rem;
      font-weight: 800;
      position: relative;
      background: linear-gradient(to right, var(--gold), white, var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    h2::after {
      content: "";
      position: absolute;
      bottom: -12px;
      right: 50%;
      transform: translateX(50%);
      width: 70%;
      height: 5px;
      background: var(--gold);
      border-radius: 2px;
      box-shadow: 0 0 15px var(--gold);
    }

    h2 i {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      background: linear-gradient(to right, var(--secondary), var(--gold));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 4px 20px rgba(0,0,0,0.4);
      display: block;
      animation: floatIcon 3s infinite ease-in-out;
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    /* ========== FORMS ========== */
    .form-group {
      margin-bottom: 1.8rem;
    }

    label {      display: block;
      margin-bottom: 0.8rem;
      font-weight: 700;
      font-size: 1.15rem;
      color: var(--gold);
      position: relative;
      padding-bottom: 5px;
    }

    label::after {
      content: "";
      position: absolute;
      bottom: 0;
      right: 0;
      width: 40px;
      height: 2px;
      background: var(--gold);
      border-radius: 1px;
    }

    input {
      width: 100%;
      padding: 1rem;
      border: 2px solid var(--border);
      border-radius: 16px;
      font-size: 1.05rem;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      transition: var(--transition);
      backdrop-filter: blur(10px);
      font-family: 'Vazirmatn', sans-serif;
    }

    input:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
      transform: scale(1.01);
      background: rgba(255, 255, 255, 0.15);
    }

    /* ========== BUTTON ========== */
    .btn {
      width: 100%;
      padding: 1.2rem;
      background: var(--glass-light);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: white;
      border: 2px solid var(--border-strong);      border-radius: 50px;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    }

    .btn::before {
      content: "";
      position: absolute;
      top: -2px;
      right: -2px;
      bottom: -2px;
      left: -2px;
      background: linear-gradient(45deg, var(--gold), var(--secondary), var(--accent), var(--gold));
      z-index: -1;
      border-radius: 53px;
      animation: rotateGradient 8s linear infinite;
      opacity: 0.85;
    }

    .btn:hover {
      transform: translateY(-5px) scale(1.05);
      box-shadow: var(--shadow-hover);
    }

    /* ========== SUCCESS MESSAGE ========== */
    .success-msg {
      text-align: center;
      margin-top: 1.5rem;
      color: #4CAF50;
      font-weight: 700;
      font-size: 1.2rem;
      display: none;
      padding: 1.2rem;
      background: rgba(76, 175, 80, 0.15);
      border: 2px solid rgba(76, 175, 80, 0.4);
      border-radius: 16px;
      animation: fadeIn 0.5s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* ========== RESPONSIVE ========== */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 0.8rem;
      }

      .back-link {
        top: 1.2rem;
        left: 1.2rem;
        font-size: 1rem;
        padding: 0.5rem 1.2rem;
      }

      .panel {
        padding: 2rem;
        border-radius: 28px;
      }

      .panel::before {
        border-radius: 31px;
      }

      .panel::after {
        border-radius: 28px;
      }

      h2 {
        font-size: 2.2rem;
      }

      h2 i {
        font-size: 2.8rem;
      }

      label {
        font-size: 1.05rem;
      }

      input {
        padding: 0.9rem;
        font-size: 1rem;
      }

      .btn {
        padding: 1rem;
        font-size: 1.1rem;
        margin-top: 1.2rem;
      }

      .success-msg {        font-size: 1.05rem;
        padding: 1rem;
      }
    }

    @media (max-width: 480px) {
      body {
        padding: 1rem 0.5rem;
      }

      .back-link {
        top: 1rem;
        left: 1rem;
        font-size: 0.95rem;
        padding: 0.4rem 1rem;
      }

      .panel {
        padding: 1.8rem;
        border-radius: 24px;
        margin: 0 10px;
      }

      .panel::before {
        border-radius: 27px;
      }

      .panel::after {
        border-radius: 24px;
      }

      h2 {
        font-size: 1.9rem;
      }

      h2::after {
        width: 65%;
        height: 4px;
      }

      h2 i {
        font-size: 2.4rem;
        margin-bottom: 0.8rem;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      label {        font-size: 1rem;
        margin-bottom: 0.6rem;
      }

      label::after {
        width: 35px;
        height: 2px;
      }

      input {
        padding: 0.85rem;
        font-size: 0.95rem;
        border-radius: 14px;
      }

      .btn {
        padding: 0.9rem;
        font-size: 1rem;
        margin-top: 1rem;
        border-radius: 45px;
      }

      .btn::before {
        border-radius: 48px;
      }

      .success-msg {
        font-size: 0.95rem;
        padding: 0.9rem;
        margin-top: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <!-- Floating decorative orbs -->
  <div class="floating-orb" style="width: 200px; height: 200px; top: 15%; left: 8%; animation-delay: 0s;"></div>
  <div class="floating-orb" style="width: 160px; height: 160px; top: 65%; left: 92%; animation-delay: -7s;"></div>
  <div class="floating-orb" style="width: 120px; height: 120px; top: 80%; left: 12%; animation-delay: -15s;"></div>
  <div class="floating-orb" style="width: 180px; height: 180px; top: 45%; left: 85%; animation-delay: -10s;"></div>
  
  <!-- Scroll Progress Indicator -->
  <div class="scroll-progress" id="scroll-progress"></div>

  <a href="index.html" class="back-link">
    <i class="fas fa-arrow-right"></i> بازگشت
  </a>

  <div class="panel">    <h2>
      <i class="fas fa-calendar-check"></i>
      رزرو نوبت مشاوره
    </h2>
    <form id="consultForm" action="https://formspree.io/f/mjgkklez" method="POST">
      <div class="form-group">
        <label><i class="fas fa-user"></i> نام و نام خانوادگی</label>
        <input type="text" name="fullname" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-mobile-alt"></i> شماره موبایل</label>
        <input type="tel" name="phone" placeholder="0912..." required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-calendar-day"></i> تاریخ نوبت</label>
        <input type="text" name="date" placeholder="1404/10/15" required>
      </div>
      <div class="form-group">
        <label><i class="fas fa-clock"></i> ساعت نوبت</label>
        <input type="text" name="time" placeholder="14:00" required>
      </div>
      <button type="submit" class="btn">
        <i class="fas fa-paper-plane"></i> ارسال درخواست
      </button>
    </form>
    <div class="success-msg" id="successMsg">✅ درخواست شما با موفقیت ارسال شد!</div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Animate back link
      setTimeout(() => {
        document.querySelector('.back-link').classList.add('visible');
      }, 200);
      
      // Animate panel
      setTimeout(() => {
        document.querySelector('.panel').classList.add('visible');
      }, 400);
      
      // Scroll progress indicator
      window.addEventListener('scroll', () => {
        const scrollTop = document.documentElement.scrollTop;
        const scrollHeight = document.documentElement.scrollHeight;
        const clientHeight = document.documentElement.clientHeight;
        const scrolled = (scrollTop / (scrollHeight - clientHeight)) * 100;
        document.getElementById('scroll-progress').style.width = `${scrolled}%`;
      });
      
      // Add floating animation to orbs      document.querySelectorAll('.floating-orb').forEach((orb, index) => {
        const duration = 25 + Math.random() * 15;
        const delay = Math.random() * 10;
        orb.style.animationDuration = `${duration}s`;
        orb.style.animationDelay = `${-delay}s`;
      });
      
      // Parallax effect on page
      document.addEventListener('mousemove', (e) => {
        if (window.innerWidth > 768) {
          const xAxis = (window.innerWidth / 2 - e.pageX) / 50;
          const yAxis = (window.innerHeight / 2 - e.pageY) / 50;
          document.body.style.backgroundPosition = `${50 + xAxis}% ${50 + yAxis}%`;
        }
      });
    });

    const form = document.getElementById('consultForm');
    form.addEventListener('submit', async function(e) {
      e.preventDefault();
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: 'POST',
        body: data,
        headers: { 'Accept': 'application/json' }
      });
      if (res.ok) {
        form.reset();
        document.getElementById('successMsg').style.display = 'block';
        setTimeout(() => {
          document.getElementById('successMsg').style.display = 'none';
        }, 5000);
      } else {
        alert('خطا در ارسال! لطفاً دوباره تلاش کنید.');
      }
    });
  </script>

</body>
</html>
