<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ورود پنل دبیران | دبیرستان حضرت امام خامنه‌ای</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --gold: #d4af37; --blue: #2196F3; --dark-bg: #0a0a1a;
      --card-bg: rgba(255, 255, 255, 0.1); --card-border: rgba(255, 255, 255, 0.3);
      --transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: linear-gradient(135deg, var(--dark-bg), #0f1428, #0a0f1f, var(--dark-bg));
      color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center;
      padding: 2rem; position: relative; overflow: hidden;
    }
    body::before {
      content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 10% 20%, rgba(255, 60, 78, 0.08) 0%, transparent 25%),
                  radial-gradient(circle at 90% 30%, rgba(33, 150, 243, 0.07) 0%, transparent 25%),
                  radial-gradient(circle at 30% 80%, rgba(212, 175, 55, 0.06) 0%, transparent 25%),
                  radial-gradient(circle at 70% 70%, rgba(156, 39, 176, 0.07) 0%, transparent 25%);
      z-index: -3; opacity: 0.85;
    }
    .floating-orb {
      position: fixed; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
      z-index: -2; animation: floatOrb 25s infinite linear; opacity: 0.6;
      box-shadow: 0 0 35px rgba(255, 255, 255, 0.3);
    }
    @keyframes floatOrb {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.6; }
      25% { transform: translateY(-60px) translateX(40px) rotate(90deg); opacity: 0.3; }
      50% { transform: translateY(-120px) translateX(0) rotate(180deg); opacity: 0.1; }
      75% { transform: translateY(-60px) translateX(-40px) rotate(270deg); opacity: 0.3; }
      100% { transform: translateY(0) translateX(0) rotate(360deg); opacity: 0.6; }
    }
    .login-container { max-width: 550px; width: 100%; animation: fadeInUp 0.8s ease-out; }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .login-card {
      background: var(--card-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
      border: 2px solid var(--card-border); border-radius: 40px; padding: 3.5rem; text-align: center;      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); position: relative; overflow: hidden;
      transform: translateY(20px); opacity: 0; animation: slideIn 0.6s ease-out forwards 0.2s;
    }
    @keyframes slideIn { to { transform: translateY(0); opacity: 1; } }
    .login-card::before {
      content: ""; position: absolute; top: -2px; right: -2px; bottom: -2px; left: -2px;
      background: linear-gradient(45deg, var(--gold), var(--blue), var(--gold));
      z-index: -1; border-radius: 43px; animation: rotateGradient 18s linear infinite; opacity: 0.9;
    }
    @keyframes rotateGradient { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .card-header { margin-bottom: 2.5rem; }
    .card-header i {
      font-size: 5.5rem; margin-bottom: 1.5rem;
      background: linear-gradient(to right, var(--gold), var(--blue), var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      display: block; animation: floatIcon 4s ease-in-out infinite; text-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }
    @keyframes floatIcon { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-15px) scale(1.05); } }
    .card-header h1 {
      font-size: 3rem; margin-bottom: 1rem;
      background: linear-gradient(to right, var(--gold), white, var(--gold));
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-weight: 800; position: relative; display: inline-block;
    }
    .card-header h1::after {
      content: ""; position: absolute; bottom: -12px; right: 50%; transform: translateX(-50%);
      width: 75%; height: 5px; background: var(--gold); border-radius: 3px; box-shadow: 0 0 20px var(--gold);
    }
    .card-header p { font-size: 1.5rem; opacity: 0.92; margin-top: 1.2rem; line-height: 1.7; }
    .continue-btn {
      width: 100%; padding: 1.8rem;
      background: linear-gradient(45deg, var(--gold), var(--blue), var(--gold));
      color: var(--dark-bg); border: none; border-radius: 55px;
      font-size: 1.65rem; font-weight: 800; cursor: pointer; margin-top: 1.5rem;
      transition: var(--transition); font-family: 'Vazirmatn', sans-serif;
      position: relative; overflow: hidden; box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5);
      letter-spacing: 1px; display: flex; align-items: center; justify-content: center; gap: 15px;
    }
    .continue-btn::before {
      content: ""; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
      transition: left 0.8s; z-index: -1;
    }
    .continue-btn:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 12px 30px rgba(212, 175, 55, 0.75); }
    .continue-btn:hover::before { left: 100%; }
    .continue-btn:active { transform: translateY(1px); }
    .security-note {
      background: rgba(33, 150, 243, 0.15); border-left: 4px solid var(--blue);
      border-radius: 0 15px 15px 0; padding: 1.5rem; margin-top: 2.5rem;
      text-align: right; font-size: 1.15rem; line-height: 1.7;    }
    .security-note strong { color: var(--gold); display: block; margin: 8px 0; }
    .security-note i { color: var(--blue); margin-left: 5px; }
    @media (max-width: 768px) {
      .login-card { padding: 2.8rem 2.2rem; border-radius: 35px; }
      .card-header i { font-size: 4.6rem; }
      .card-header h1 { font-size: 2.5rem; }
      .card-header p { font-size: 1.35rem; }
      .continue-btn { padding: 1.6rem; font-size: 1.5rem; border-radius: 50px; }
      .security-note { font-size: 1.05rem; padding: 1.2rem; }
    }
    @media (max-width: 480px) {
      body { padding: 1rem; }
      .login-container { max-width: 100%; }
      .login-card { padding: 2.3rem 1.8rem; border-radius: 30px; margin: 0 10px; }
      .login-card::before { border-radius: 33px; }
      .card-header i { font-size: 4rem; margin-bottom: 1.2rem; }
      .card-header h1 { font-size: 2.2rem; }
      .card-header h1::after { width: 70%; height: 4px; }
      .card-header p { font-size: 1.25rem; margin-top: 1rem; }
      .continue-btn { padding: 1.5rem; font-size: 1.45rem; border-radius: 48px; }
      .security-note { font-size: 1rem; padding: 1rem; margin-top: 2rem; }
      .floating-orb { display: none; }
    }
  </style>
</head>
<body>
  <div class="floating-orb" style="width: 220px; height: 220px; top: 10%; left: 5%; animation-delay: 0s;"></div>
  <div class="floating-orb" style="width: 180px; height: 180px; top: 65%; left: 90%; animation-delay: -8s;"></div>
  <div class="floating-orb" style="width: 140px; height: 140px; top: 85%; left: 10%; animation-delay: -16s;"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="card-header">
        <i class="fas fa-chalkboard-teacher"></i>
        <h1>پنل دبیران</h1>
        <p>دبیرستان حضرت امام خامنه‌ای (ره)</p>
      </div>
      
      <button class="continue-btn" id="continue-btn">
        <i class="fas fa-user-graduate"></i> ادامه با آیدی مدرسه خامنه‌ای
      </button>
      
      <div class="security-note">
        <i class="fas fa-shield-alt"></i> <strong>امنیت حساب شما:</strong>
        <br>• سیستم ورود ما از رمزنگاری پیشرفته استفاده می‌کند
        <br>• پس از اولین ورود موفق، فقط نیاز به تأیید دو مرحله‌ای دارید
        <br>• اطلاعات شما هرگز در سرور ذخیره نمی‌شود
      </div>
    </div>  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.floating-orb').forEach((orb, index) => {
        const duration = 25 + Math.random() * 15;
        const delay = Math.random() * 10;
        orb.style.animationDuration = `${duration}s`;
        orb.style.animationDelay = `${-delay}s`;
      });
      
      const savedTeacher = localStorage.getItem('currentTeacher');
      
      document.getElementById('continue-btn').addEventListener('click', () => {
        if (savedTeacher) {
          window.location.href = 'secure-login.html?resume=1';
        } else {
          window.location.href = 'secure-login.html';
        }
      });
      
      document.getElementById('continue-btn').focus();
    });
  </script>
</body>
</html>
